<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>X Locations</title>
    <style>
      :root {
        --bg: #101315;
        --text: #cacccc;
        --dim: color-mix(in srgb, var(--text) 70%, var(--bg));
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 12px/1.45 ui-sans-serif, system-ui, sans-serif;
        color-scheme: dark;
      }
      body {
        min-width: 220px;
        padding: 12px 14px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 13px;
      }
      p {
        margin: 0;
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <h1>X Locations</h1>
    <p>Account based in flags on x.com. Log in, then check a tweet author.</p>
  </body>
</html>
